<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>A message for Sita</title>
    <meta name="description" content="Record a short video message." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/record.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="grain"></div>

    <main class="wrap">
      <p class="eyebrow">An exhibition in her honour</p>
      <h1>A message for<br /><em data-honoree>Sita</em></h1>
      <p class="lede">
        Press record and say something lovely. A minute is plenty &mdash; it all goes into a
        gallery she opens on her birthday.
      </p>

      <div class="rule"><span></span></div>

      <form class="glass" id="form" novalidate>
        <div class="stage" id="stage">
          <video id="preview" playsinline muted autoplay hidden></video>
          <video id="playback" playsinline controls hidden></video>

          <div class="stage-idle" id="stageIdle">
            <p id="idleText">Your camera, your words.<br />Nothing is saved until you send it.</p>
          </div>

          <div class="timer" id="timer"><i></i><span id="timerText">0:00</span></div>
          <button type="button" class="flip" id="flip" aria-label="Switch camera">&#8635;</button>
        </div>

        <div class="controls" id="controls">
          <div class="side"></div>
          <button
            type="button"
            class="shutter"
            id="shutter"
            data-state="idle"
            aria-label="Start recording"
          >
            <span class="ring"></span>
            <span class="core"></span>
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle id="countdown" cx="50" cy="50" r="48" />
            </svg>
          </button>
          <div class="side"></div>
        </div>

        <p class="hint-line" id="hint">Tap to start recording</p>

        <div class="review-actions" id="reviewActions">
          <button type="button" class="btn btn--ghost" id="retake">Retake</button>
          <button type="button" class="btn" id="keep">Use this</button>
        </div>

        <div class="filepick" id="filepick">
          <input type="file" id="video" accept="video/*" />
          <label for="video" id="filepickLabel">or upload a video instead</label>
        </div>

        <div class="details" id="details">
          <div class="rule"><span></span></div>

          <div class="field">
            <label for="name">Your name</label>
            <input
              type="text"
              id="name"
              maxlength="60"
              autocomplete="name"
              placeholder="So she knows who it's from"
              required
            />
          </div>

          <div class="field">
            <label for="message">A note <span style="text-transform: none">(optional)</span></label>
            <textarea id="message" maxlength="500" placeholder="Written beside your film"></textarea>
          </div>

          <button class="btn" type="submit" id="submit">Send to the gallery</button>

          <div class="progress" id="progress">
            <div class="track"><div class="bar" id="progressBar"></div></div>
            <div class="label" id="progressLabel">Uploading</div>
          </div>
        </div>

        <div class="error" id="error" role="alert"></div>
      </form>

      <p class="footnote">Only <span data-honoree>Sita</span> will see this</p>
    </main>

    <script src="/upload.js" type="module"></script>
  </body>
</html>
