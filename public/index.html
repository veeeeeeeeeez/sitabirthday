<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>A message for Sita</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/record.css" />
  </head>
  <body class="record-body">
    <form class="stage-wrap" id="form" novalidate>
      <header class="intro" id="intro">
        <h1><em data-honoree>Sita</em> is turning 22!</h1>
        <p id="introLine">This is a secret so hushhh. Press record to leave a lovely message &mdash; stoked for her to hear from you all.</p>
      </header>

      <div class="stage" id="stage">
        <!-- Source only: never shown, it just feeds the canvas. -->
        <video id="preview" playsinline muted autoplay></video>
        <!-- What you actually see, and the exact thing that gets recorded. -->
        <canvas id="mirror"></canvas>
        <video id="playback" playsinline loop hidden></video>

        <div class="stage-idle" id="stageIdle"><p id="idleText"></p></div>

        <div class="timer" id="timer"><i></i><span id="timerText">0:00</span></div>

        <button type="button" class="flip-cam" id="flip" aria-label="Switch camera">&#8635;</button>

        <div
          class="scrub"
          id="scrub"
          role="slider"
          aria-label="Playback position"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="-1"
        >
          <div class="scrub-fill" id="scrubFill"></div>
        </div>
      </div>

      <div class="review" id="reviewActions">
        <input
          type="text"
          id="name"
          maxlength="60"
          autocomplete="name"
          placeholder="Your name"
          required
        />
        <textarea id="message" maxlength="500" rows="2" placeholder="A note (optional)"></textarea>
        <div class="review-row">
          <button type="button" class="pill" id="retake">Retake</button>
          <button type="submit" class="pill pill--dark" id="submit">Send</button>
        </div>
        <div class="progress" id="progress">
          <div class="track"><div class="bar" id="progressBar"></div></div>
          <div class="label" id="progressLabel"></div>
        </div>
      </div>

      <div class="controls" id="controls">
        <button
          type="button"
          class="shutter"
          id="shutter"
          data-state="idle"
          aria-label="Record a video"
        >
          <span class="ring"></span>
          <span class="core"></span>
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle id="countdown" cx="50" cy="50" r="48" />
          </svg>
        </button>

        <div class="filepick" id="filepick">
          <input type="file" id="video" accept="video/*" />
          <label for="video" id="filepickLabel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Upload
          </label>
        </div>
      </div>

      <p class="hint-line" id="hint"></p>
      <div class="error" id="error" role="alert"></div>
    </form>

    <script src="/upload.js" type="module"></script>
  </body>
</html>
