<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>A message for Sita</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/record.css" />
  </head>
  <body class="record-body">
    <form class="stage-wrap" id="form" novalidate>
      <header class="intro" id="intro">
        <h1>Leave <em data-honoree>Sita</em> a birthday message</h1>
        <p id="introLine">Press record and say something lovely. A minute is plenty.</p>
      </header>

      <div class="stage" id="stage">
        <video id="preview" playsinline muted autoplay></video>
        <video id="playback" playsinline loop></video>
        <!-- The recording is taken from here, so the mirror is in the file. -->
        <canvas id="mirror" hidden></canvas>

        <div class="stage-idle" id="stageIdle"><p id="idleText"></p></div>

        <div class="timer" id="timer"><i></i><span id="timerText">0:00</span></div>

        <button type="button" class="flip-cam" id="flip" aria-label="Switch camera">&#8635;</button>

        <div class="filepick" id="filepick">
          <input type="file" id="video" accept="video/*" />
          <label for="video" id="filepickLabel" aria-label="Upload a video instead">&#8593;</label>
        </div>

        <div class="review" id="reviewActions">
          <input
            type="text"
            id="name"
            maxlength="60"
            autocomplete="name"
            placeholder="Your name"
            required
          />
          <input type="text" id="message" maxlength="500" placeholder="A note (optional)" />
          <div class="review-row">
            <button type="button" class="pill" id="retake">Retake</button>
            <button type="submit" class="pill pill--solid" id="submit">Send</button>
          </div>
          <div class="progress" id="progress">
            <div class="track"><div class="bar" id="progressBar"></div></div>
            <div class="label" id="progressLabel"></div>
          </div>
        </div>

        <div
          class="scrub"
          id="scrub"
          role="slider"
          aria-label="Playback position"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="-1"
        >
          <div class="scrub-fill" id="scrubFill"></div>
        </div>
      </div>

      <button
        type="button"
        class="shutter"
        id="shutter"
        data-state="idle"
        aria-label="Record a video"
      >
        <span class="ring"></span>
        <span class="core"></span>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle id="countdown" cx="50" cy="50" r="48" />
        </svg>
      </button>

      <p class="hint-line" id="hint"></p>
      <div class="error" id="error" role="alert"></div>
    </form>

    <script src="/upload.js" type="module"></script>
  </body>
</html>
