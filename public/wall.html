<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The exhibition</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/wall.css" />
  </head>
  <body class="wall-body">
    <header class="wall-header">
      <p class="eyebrow">A private exhibition</p>
      <h1><em data-honoree>Sita</em></h1>
      <p class="lede" id="subtitle">Assembled by the people who love you.</p>
    </header>

    <div class="wall-meta">
      <span id="countLabel">&nbsp;</span>
      <span id="yearLabel">MMXXVI</span>
    </div>

    <main>
      <div class="gallery is-empty" id="gallery" aria-live="polite">
        <p class="board-status" id="status">Unlocking the gallery&hellip;</p>
      </div>

      <div class="scroll-cue">
        <p id="cueText">&nbsp;</p>
        <div class="arrows">
          <button type="button" id="scrollLeft" aria-label="Scroll left">&#8249;</button>
          <button type="button" id="scrollRight" aria-label="Scroll right">&#8250;</button>
        </div>
      </div>
    </main>

    <footer class="wall-footer">
      <p>Happy birthday</p>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Video message"
      hidden
    >
      <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
      <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
      <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Next">&#8250;</button>

      <div class="lightbox-inner">
        <div class="lightbox-stage">
          <video id="lbVideo" controls playsinline preload="metadata"></video>
        </div>
        <div class="lightbox-caption">
          <p class="lightbox-name" id="lbName"></p>
          <p class="lightbox-message" id="lbMessage"></p>
          <p class="lightbox-index" id="lbIndex"></p>
        </div>
      </div>
    </div>

    <script src="/wall.js" type="module"></script>
  </body>
</html>
