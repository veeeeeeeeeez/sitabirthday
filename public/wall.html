<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The exhibition</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/wall.css" />
    <style>
      .backdrop {
        --art: url('/img/primavera.jpg');
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="grain"></div>

    <header class="wall-header">
      <p class="eyebrow" id="eyebrow">A private exhibition</p>
      <h1><em data-honoree>Sita</em></h1>
      <p class="lede" id="subtitle">Assembled by the people who love you.</p>
      <div class="rule"><span></span></div>
    </header>

    <main class="wrap wrap--wide">
      <div class="board" id="board" aria-live="polite">
        <p class="board-status" id="status">Unlocking the gallery&hellip;</p>
      </div>
    </main>

    <footer class="wall-footer">
      <p>Happy birthday.</p>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Video message"
      hidden
    >
      <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
      <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
      <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Next">&#8250;</button>

      <div class="lightbox-inner">
        <div class="lightbox-stage">
          <video id="lbVideo" controls playsinline preload="metadata"></video>
        </div>
        <div class="lightbox-caption">
          <p class="lightbox-name" id="lbName"></p>
          <p class="lightbox-message" id="lbMessage"></p>
          <p class="lightbox-index" id="lbIndex"></p>
        </div>
      </div>
    </div>

    <script src="/wall.js" type="module"></script>
  </body>
</html>
