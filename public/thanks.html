<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thank you</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .backdrop {
        --art: url('/img/primavera.jpg');
      }
      .thanks {
        text-align: center;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .thanks .glass {
        padding-block: clamp(2.5rem, 8vh, 4rem);
      }
      .thanks .btn {
        width: auto;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="grain"></div>

    <main class="wrap thanks">
      <div class="glass">
        <p class="eyebrow">Acquired for the collection</p>
        <h1>Thank you<em id="who"></em></h1>
        <div class="rule"><span></span></div>
        <p class="lede" style="margin-bottom: 0">
          Your film is hung and waiting. <span data-honoree>She</span> is going to love it.
        </p>
        <a class="btn btn--ghost" href="/">Record another</a>
      </div>
    </main>

    <script type="module">
      const name = sessionStorage.getItem('senderName')
      if (name) document.getElementById('who').textContent = `, ${name}`

      fetch('/api/config')
        .then((r) => r.json())
        .then(({ honoree }) => {
          for (const el of document.querySelectorAll('[data-honoree]')) el.textContent = honoree
        })
        .catch(() => {})
    </script>
  </body>
</html>
