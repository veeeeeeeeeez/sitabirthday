<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thank you</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/record.css" />
  </head>
  <body class="record-body">
    <main class="thanks">
      <h1>Thank you<em id="who"></em></h1>
      <p>Can't wait for <span data-honoree>Sita</span> to hear from you. It means a lot.</p>
      <a class="pill pill--dark" href="/">Send another</a>
    </main>

    <script type="module">
      const name = sessionStorage.getItem('senderName')
      if (name) document.getElementById('who').textContent = `, ${name}`

      fetch('/api/config')
        .then((r) => r.json())
        .then(({ honoree }) => {
          for (const el of document.querySelectorAll('[data-honoree]')) el.textContent = honoree
        })
        .catch(() => {})
    </script>
  </body>
</html>
